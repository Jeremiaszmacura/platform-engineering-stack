apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-map
  namespace: monitoring
  labels:
    app: cluster-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-map
  template:
    metadata:
      labels:
        app: cluster-map
    spec:
      serviceAccountName: cluster-map
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # distroless "nonroot"
      containers:
        - name: cluster-map
          image: cluster-map:dev  # built locally and loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CLUSTER_NAME
              value: sample-cluster
            - name: REFERENCES
              value: grafana=http://prometheus-service:9090  # Grafana's datasource, set by Ansible outside Kubernetes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          # Ready once the informers have finished their first list
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-map-service
  namespace: monitoring
  labels:
    app: cluster-map
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: cluster-map
spec:
  type: ClusterIP
  selector:
    app: cluster-map
  ports:
    - port: 8080
      targetPort: 8080
