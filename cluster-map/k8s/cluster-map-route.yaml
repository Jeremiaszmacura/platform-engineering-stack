apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster-map-route
  namespace: monitoring
  labels:
    app: cluster-map
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - cluster-map.localhost
  rules:
    - backendRefs:
        - name: cluster-map-service
          port: 8080
