apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-map-ingress
  namespace: monitoring
  labels:
    app: cluster-map
spec:
  ingressClassName: nginx
  rules:
    - host: cluster-map.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cluster-map-service
                port:
                  number: 8080
