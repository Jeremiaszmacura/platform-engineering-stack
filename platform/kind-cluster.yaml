# Host ports 80 (HTTP) and 443 (HTTPS) go to node ports 30080 and 30443 of the control-plane container: the NodePorts
# of the shared Gateway's Envoy proxy (platform/gateway/envoyproxy.yaml). kube-proxy forwards them to the proxy pod on
# whichever node it runs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080  # NodePorts of the shared-gateway-proxy Service
        hostPort: 80
        listenAddress: "127.0.0.1"  # this machine only
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
