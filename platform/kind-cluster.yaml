# Host port 80 goes to node port 30080 of the control-plane container: the NodePort of the shared Gateway's Envoy
# proxy (platform/gateway/envoyproxy.yaml). kube-proxy forwards it to the proxy pod on whichever node it runs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080  # NodePort of the shared-gateway-proxy Service
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker
