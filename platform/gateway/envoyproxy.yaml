# How Envoy Gateway deploys the Envoy proxy that serves shared-gateway (referenced by gateway.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: shared-gateway
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        name: shared-gateway-proxy
        container:
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
        # The sidecar that drains Envoy on shutdown has no limits upstream; it idles at about 95Mi.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits: {cpu: 200m, memory: 256Mi}
      # kind maps host ports 80 and 443 to node ports 30080 and 30443 of the control-plane node (platform/kind-cluster.yaml).
      # A NodePort is open on every node, so kube-proxy forwards it to the proxy pod wherever it runs.
      envoyService:
        name: shared-gateway-proxy
        type: NodePort
        externalTrafficPolicy: Cluster  # Local would drop traffic reaching a node without a proxy pod
        annotations:
          prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
          prometheus.io/job: shared-gateway
          prometheus.io/port: "19001"  # Envoy's metrics port on the pod; the Service only exposes 80 and 443
          prometheus.io/path: /stats/prometheus
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
