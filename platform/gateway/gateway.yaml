# The single entry point for traffic from the host: every http:// and https://*.localhost request arrives here.
# HTTPRoutes name no listener (sectionName), so each one attaches to both.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: shared-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localhost"
      allowedRoutes:
        namespaces:
          # Only namespaces labelled in platform/namespaces.yaml may attach HTTPRoutes
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.localhost"
      tls:
        mode: Terminate  # Envoy decrypts here and forwards plain HTTP to the pods
        certificateRefs:
          - name: shared-gateway-tls  # the Secret cert-manager writes (certificate.yaml)
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true"
