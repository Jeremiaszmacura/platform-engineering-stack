# The cluster's own certificate authority (CA), in three steps:
# 1. the issuer `selfsigned` signs 2. the CA certificate (Secret sample-cluster-ca), with whose key
# 3. the issuer `sample-cluster-ca` signs every other certificate, such as the Gateway's (gateway/certificate.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sample-cluster-ca
  namespace: cert-manager  # a ClusterIssuer reads its CA Secret from cert-manager's own namespace
spec:
  isCA: true
  commonName: sample-cluster CA
  secretName: sample-cluster-ca
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sample-cluster-ca
spec:
  ca:
    secretName: sample-cluster-ca
