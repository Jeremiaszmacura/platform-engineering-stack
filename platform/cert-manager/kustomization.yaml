# cert-manager: turns Certificate objects into signed certificates in Secrets, and renews them before they expire.
# The upstream release manifest: CRDs, the controller, its webhook and cainjector. cluster-ca.yaml is applied after it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
patches:
  # Upstream sets no requests or limits; every workload here has them (design.html#conventions).
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
