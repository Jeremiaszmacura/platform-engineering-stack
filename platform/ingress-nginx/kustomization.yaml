# Applied with `kubectl apply -k`: the upstream kind manifest, pinned to the node that maps host port 80.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.1/deploy/static/provider/kind/deploy.yaml
patches:
  # Upstream only selects linux nodes. Rescheduled elsewhere, the controller is unreachable from the host.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ingress-nginx-controller
        namespace: ingress-nginx
      spec:
        template:
          spec:
            nodeSelector:
              ingress-ready: "true"
