# One namespace per concern; every component manifest declares its namespace
# explicitly. See platform/README.md for the ownership rule.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    name: apps
    shared-gateway-access: "true"  # may attach HTTPRoutes to shared-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    shared-gateway-access: "true"  # may attach HTTPRoutes to shared-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    name: vault
    shared-gateway-access: "true"  # may attach HTTPRoutes to shared-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    name: docs
    shared-gateway-access: "true"  # may attach HTTPRoutes to shared-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    name: data  # no shared-gateway-access: TimescaleDB is reachable from inside the cluster only
