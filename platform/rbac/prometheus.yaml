# Cluster-scoped RBAC for Prometheus Kubernetes service discovery.
# Read-only: Prometheus only lists/watches discovery objects and scrapes
# /metrics. The prometheus ServiceAccount itself lives with the component
# (monitoring/prometheus/k8s/) — only the cluster-scoped grant lives here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
