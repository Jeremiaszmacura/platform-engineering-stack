# Lets Vault (ServiceAccount in vault/k8s/) ask the API whether a pod's ServiceAccount token is genuine, for its
# kubernetes auth method. The built-in system:auth-delegator allows only creating TokenReviews and
# SubjectAccessReviews, which read nothing and change nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
