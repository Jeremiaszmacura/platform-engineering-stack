apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: apps
  labels:
    app: nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      serviceAccountName: nginx-exporter
      containers:
        - name: exporter
          image: nginx/nginx-prometheus-exporter:latest
          args:
            - -nginx.scrape-uri=http://nginx-service/nginx_status
          ports:
            - containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: apps
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: nginx-metrics  # Keeps the historic job label for dashboards
spec:
  selector:
    app: nginx-exporter
  ports:
    - port: 9113
      targetPort: 9113
