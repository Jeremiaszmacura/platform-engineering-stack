apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # the image's default "nginx" user
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        # Sidecar: one exporter per nginx pod, so each pod is its own scrape target
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - --nginx.scrape-uri=http://localhost:8080/nginx_status
          ports:
            - containerPort: 9113
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 8080
---
# Headless: DNS returns every pod's IP, so Prometheus scrapes each exporter separately
apiVersion: v1
kind: Service
metadata:
  name: nginx-metrics-service
  labels:
    app: nginx
spec:
  clusterIP: None
  selector:
    app: nginx
  ports:
    - port: 9113
      targetPort: 9113
