apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: apps
  labels:
    app: nginx
data:
  # Replaces the image's default server block (non-root image, port 8080)
  default.conf: |
    server {
      listen 8080;

      location / {
        return 200 'Hello from NGINX\n';
      }

      # Read by the nginx-exporter sidecar over localhost only
      location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
    }
