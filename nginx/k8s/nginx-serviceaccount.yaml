# No Kubernetes API access: token automount disabled — see platform/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  namespace: apps
  labels:
    app: nginx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-exporter
  namespace: apps
