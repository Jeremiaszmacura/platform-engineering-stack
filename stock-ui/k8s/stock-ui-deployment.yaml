apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ui-deployment
  namespace: apps
  labels:
    app: stock-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ui
  template:
    metadata:
      labels:
        app: stock-ui
    spec:
      serviceAccountName: stock-ui
      containers:
        - name: stock-ui
          image: stock-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ui-service
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: stock-ui
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
