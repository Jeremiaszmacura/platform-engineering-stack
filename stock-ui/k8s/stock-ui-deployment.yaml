apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ui
  namespace: apps
  labels:
    app: stock-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ui
  template:
    metadata:
      labels:
        app: stock-ui
    spec:
      serviceAccountName: stock-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx-unprivileged's default user
      containers:
        - name: stock-ui
          image: stock-ui:dev  # built locally and loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stock-ui-service
  namespace: apps
  labels:
    app: stock-ui
spec:
  type: ClusterIP
  selector:
    app: stock-ui
  ports:
    - port: 80
      targetPort: 8080
