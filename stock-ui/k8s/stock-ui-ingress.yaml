apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-ui-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
    - host: stock-ui.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-ui-service
                port:
                  number: 80
