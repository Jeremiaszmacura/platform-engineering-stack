apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stock-ui-route
  namespace: apps
  labels:
    app: stock-ui
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - stock-ui.localhost
  rules:
    - backendRefs:
        - name: stock-ui-service
          port: 80
