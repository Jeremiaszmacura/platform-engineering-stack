apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app-deployment
  namespace: apps
  labels:
    app: go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      serviceAccountName: go-app
      containers:
        - name: go-app
          image: go-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VAULT_ADDR
              value: http://vault-service.vault:8200  # Cross-namespace: vault runs in the vault namespace
            - name: VAULT_TOKEN
              value: root  # Dev-mode root token, see vault/README.md
            - name: VAULT_SECRET_PATH
              value: go-app  # Own path under services/ so Vault roles can scope per service
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-app-service
  namespace: apps
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: go-app  # Keeps the historic job label for dashboards/e2e
spec:
  type: ClusterIP
  selector:
    app: go-app
  ports:
    - port: 8080
      targetPort: 8080