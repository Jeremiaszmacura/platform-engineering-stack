# Alert rules, loaded by rule_files in prometheus.yml. Prometheus sends firing alerts to Alertmanager
# (alertmanager.localhost), which sends nothing on.
groups:
  - name: monitoring
    rules:
      # Always firing: its absence in Alertmanager means the alerting pipeline is broken.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Prometheus can evaluate rules and reach Alertmanager."
      # A Service scaled to zero has no target at all, so this can't see it; SpansQueued covers Tempo.
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} on {{ $labels.pod }}."
      # While Tempo is unreachable the exporter retries each batch for about 5 minutes, and the queue (which counts
      # the batches being retried too) never empties. A busy but healthy Collector empties it within milliseconds.
      - alert: SpansQueued
        expr: sum by (exporter) (min_over_time(otelcol_exporter_queue_size[1m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "The Collector can't send spans to {{ $labels.exporter }}; they wait in its queue."
      # Retries gave up: these spans are lost. The counter only appears with the first drop, which increase() can't
      # see, so a counter that didn't exist 5 minutes ago fires too, but only if Prometheus scraped that pod then:
      # a restarted Prometheus has no history, and every counter would look new.
      - alert: SpansDropped
        expr: >-
          sum by (exporter) (increase(otelcol_exporter_send_failed_spans[5m])) > 0
          or sum by (exporter) (
            (otelcol_exporter_send_failed_spans unless on(pod, exporter) otelcol_exporter_send_failed_spans offset 5m)
            and on(pod) (up{job="otel-collector"} offset 5m == 1)
          )
        labels:
          severity: critical
        annotations:
          summary: "The Collector dropped spans it couldn't send to {{ $labels.exporter }}."
