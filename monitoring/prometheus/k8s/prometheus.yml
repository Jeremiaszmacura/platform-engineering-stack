global:
  scrape_interval: 15s

# Alert rules, next to this file in the same ConfigMap.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'self'
    static_configs:
      - targets: ['localhost:9090']

  # Each node's kubelet: CPU and memory of the node, its pods and their containers, measured per cgroup.
  - job_name: 'kubelet'
    scheme: https
    metrics_path: /metrics/resource
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      # kind's kubelets serve a self-signed certificate; the token still authenticates every scrape.
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  # Scrapes Services annotated prometheus.io/scrape: "true"; prometheus.io/job sets the job label.
  - job_name: 'kubernetes-services'
    scrape_interval: 5s
    kubernetes_sd_configs:
      - role: endpoints
        # kube-system Services carry the same annotation.
        namespaces:
          names: [apps, monitoring, vault, data, docs, envoy-gateway-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Keep only Service ports; role: endpoints also adds the pods' other container ports.
      - source_labels: [__meta_kubernetes_endpoint_port_protocol]
        action: keep
        regex: .+
      # prometheus.io/port picks the metrics port of a multi-port Service; the other ports collapse into one target.
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # prometheus.io/path overrides the default /metrics.
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_job]
        action: replace
        target_label: job
      # Name where each series comes from (same label names as kube-prometheus and kube-state-metrics).
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
