global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'self'
    static_configs:
      - targets: ['localhost:9090']

  # Scrapes Services annotated prometheus.io/scrape: "true"; prometheus.io/job sets the job label.
  - job_name: 'kubernetes-services'
    scrape_interval: 5s
    kubernetes_sd_configs:
      - role: endpoints
        # kube-system Services carry the same annotation.
        namespaces:
          names: [apps, monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Keep only Service ports; role: endpoints also adds the pods' other container ports.
      - source_labels: [__meta_kubernetes_endpoint_port_protocol]
        action: keep
        regex: .+
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_job]
        action: replace
        target_label: job
