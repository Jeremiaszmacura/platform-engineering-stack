apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
  labels:
    app: prometheus
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - prometheus.localhost
  rules:
    - backendRefs:
        - name: prometheus-service
          port: 9090
