# Prometheus is the only workload with Kubernetes API access: it mounts its
# token for kubernetes_sd service discovery, scoped by the read-only
# ClusterRole in platform/rbac/prometheus.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
---
# No Kubernetes API access: token automount disabled — see platform/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
automountServiceAccountToken: false
