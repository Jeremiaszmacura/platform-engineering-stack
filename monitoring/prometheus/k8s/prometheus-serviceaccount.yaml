# The only ServiceAccount with API access (read-only, platform/rbac/prometheus.yaml) for service discovery.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
---
# No Kubernetes API access: token automount disabled — see platform/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
automountServiceAccountToken: false
