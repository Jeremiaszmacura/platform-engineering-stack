# Token mounted on purpose: service discovery and kubelet metrics (read-only, platform/rbac/prometheus.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
---
# No Kubernetes API access: token automount disabled (docs.localhost/security.html#api-access).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
automountServiceAccountToken: false
