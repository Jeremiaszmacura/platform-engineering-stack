# Applied with `kubectl apply -k`, which builds the ConfigMap from the plain prometheus.yml next to it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - node-exporter.yaml
  - prometheus-deployment.yaml
  - prometheus-ingress.yaml
  - prometheus-serviceaccount.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
    options:
      labels:
        app: prometheus
      disableNameSuffixHash: true  # cluster-map reads this ConfigMap by name (platform/rbac/cluster-map.yaml)
