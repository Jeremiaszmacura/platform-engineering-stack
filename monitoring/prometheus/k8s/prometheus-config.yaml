apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'self'
        static_configs:
          - targets: ['localhost:9090']

      # Every other target is discovered through the Kubernetes API: any
      # Service annotated prometheus.io/scrape: "true" gets its endpoints
      # scraped on /metrics; prometheus.io/job sets the job label so
      # dashboards and e2e tests keep the historic job names. API access is
      # granted by the prometheus ServiceAccount plus the read-only
      # ClusterRole in platform/rbac/prometheus.yaml.
      - job_name: 'kubernetes-services'
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: endpoints
            # Only our own namespaces: kube-system components (e.g. kube-dns)
            # carry the same annotation and would otherwise be scraped too.
            namespaces:
              names: [apps, monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # role: endpoints also turns every other container port of a backing
          # pod into a target (e.g. nginx's 8080 next to its exporter sidecar).
          # Only real endpoint ports carry endpoint_port_* labels: keep those.
          - source_labels: [__meta_kubernetes_endpoint_port_protocol]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_job]
            action: replace
            target_label: job
