# Applied with `kubectl apply -k`: builds Grafana's provisioning ConfigMaps from the plain files next to it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-admin-secret.yaml
  - grafana-deployment.yaml
  - grafana-route.yaml
  - grafana-serviceaccount.yaml
generatorOptions:
  labels:
    app: grafana
configMapGenerator:
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/infrastructure.json
      - dashboards/stock-app.json
      - dashboards/tracing.json
