apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
  labels:
    app: grafana
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - grafana.localhost
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
