apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472  # the image's default "grafana" user
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-password
            # Go collects garbage harder near this soft cap instead of growing into the OOM kill
            - name: GOMEMLIMIT
              value: 900MiB
          securityContext:
            allowPrivilegeEscalation: false
          # Grafana 13 idles at ~330Mi; 512Mi was OOM-killed with auto-refreshing dashboards open
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            # SQLite database (sessions, preferences): survives container restarts, not pod deletion
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 20
      # Datasources and dashboards come from ConfigMaps (kustomization.yaml) and load on every start
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
