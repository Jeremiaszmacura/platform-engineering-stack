---
- name: Deploy Grafana dashboards
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml

  tasks:
    - name: Find all dashboard JSON files
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/dashboards"
        patterns: "*.json"
      register: dashboard_files

    # Each file sets a fixed dashboard uid and "overwrite": true, so re-runs update in place
    - name: Create or update each dashboard
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/dashboards/db"
        method: POST
        user: "{{ grafana_user }}"
        password: "{{ grafana_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ lookup('file', item.path) | from_json }}"
        status_code: 200
      loop: "{{ dashboard_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
