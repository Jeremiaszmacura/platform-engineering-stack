---
- name: Configure Prometheus datasource in Grafana
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yaml
  vars:
    # Fixed uid: dashboards reference the datasource by it
    datasource:
      uid: "prometheus"
      name: "Prometheus"
      type: "prometheus"
      url: "{{ prometheus_url }}"
      access: "proxy"
      isDefault: true
      jsonData:
        timeInterval: "5s"
        queryTimeout: "60s"
        httpMethod: "POST"

  tasks:
    - name: Create the datasource (409 means it already exists)
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/datasources"
        method: POST
        user: "{{ grafana_user }}"
        password: "{{ grafana_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ datasource }}"
        status_code: [200, 409]
      register: create_result

    - name: Update the existing datasource so config changes are applied
      ansible.builtin.uri:
        url: "{{ grafana_url }}/api/datasources/uid/{{ datasource.uid }}"
        method: PUT
        user: "{{ grafana_user }}"
        password: "{{ grafana_password }}"
        force_basic_auth: true
        body_format: json
        body: "{{ datasource }}"
        status_code: 200
      when: create_result.status == 409
