apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-route
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - alertmanager.localhost
  rules:
    - backendRefs:
        - name: alertmanager-service
          port: 9093
