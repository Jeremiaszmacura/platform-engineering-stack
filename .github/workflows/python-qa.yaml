name: python quality-assurance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    name: python-qa
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Install QA tools
        run: pip install -r requirements-dev.txt

      # pre-commit hooks run over the whole repository (YAML, JSON, Python, ...)
      - name: Run linters
        run: make lint-python

      - name: Run unit tests
        run: make test-unit-python
