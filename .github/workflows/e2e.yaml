name: e2e tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          version: v0.33.0  # each kind release creates nodes of one Kubernetes version (v0.33: 1.37)
          install_only: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Yahoo rate-limits CI runners, so stock-app replays its recorded prices.
      - name: Create cluster and deploy all components
        run: STOCK_PROVIDER=fixture ./recreate-cluster.sh

      # `external` tests need live Yahoo data.
      - name: Run e2e tests
        run: make test-e2e E2E_PYTEST_ARGS='-m "not external"'

      # A restarted proxy may land on any node; host port 80 must still reach it through the NodePort.
      - name: Restart the gateway proxy and check *.localhost still answers
        run: |
          kubectl rollout restart deployment/shared-gateway-proxy -n envoy-gateway-system
          kubectl rollout status deployment/shared-gateway-proxy -n envoy-gateway-system --timeout=120s
          curl -sf --retry 15 --retry-delay 2 --retry-all-errors -o /dev/null http://stock.localhost/health

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 50 || true
          kubectl get statefulsets,pvc -n data -o wide || true
          kubectl get gateways,httproutes -A -o wide || true
          kubectl describe gateway shared-gateway -n envoy-gateway-system || true
          for ns in envoy-gateway-system apps monitoring vault docs data; do
            for deployment in $(kubectl get deployments -n "$ns" -o name); do
              echo "--- logs: $ns/$deployment ---"
              kubectl logs "$deployment" -n "$ns" --tail=50 || true
            done
          done
