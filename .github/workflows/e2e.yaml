name: e2e tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Ansible
        run: pip install ansible-core

      # Yahoo Finance rate-limits datacenter IPs, so stock-app is deployed with
      # the provider that replays the recording baked into its image. That is
      # what lets the endpoint tests cover the path that actually returns bars
      # here, rather than only the paths that reject a request.
      - name: Create cluster and deploy all components
        run: STOCK_PROVIDER=fixture ./recreate-cluster.sh

      # The remaining `external` tests drive the cache-aside pipeline against a
      # live provider by design, so they stay a local-only concern.
      - name: Run e2e tests
        run: make test-e2e E2E_PYTEST_ARGS='-m "not external"'

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 50 || true
          kubectl get statefulsets,pvc -n data -o wide || true
          for ns in apps monitoring vault docs data; do
            for deployment in $(kubectl get deployments -n "$ns" -o name); do
              echo "--- logs: $ns/$deployment ---"
              kubectl logs "$deployment" -n "$ns" --tail=50 || true
            done
          done
