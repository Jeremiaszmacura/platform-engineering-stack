# Server-side copy of the database password. Secrets are namespace-scoped and
# cannot be referenced across namespaces, so the same literal also exists in
# stock-app/k8s/stock-app-secret.yaml (namespace apps). Base64, not encrypted -
# dev playground only; Vault is the eventual single source, see vault/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-secret
  namespace: data
type: Opaque
stringData:
  postgres-password: stockapp
