# One-shot setup: enables the KV v2 mounts services/ (one sub-path per service,
# e.g. services/go-app/...) and infra/ (reserved). Safe to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-configure
  namespace: vault
  labels:
    app: vault-configure
spec:
  # Retries cover the window where Vault is still starting up
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: vault-configure
    spec:
      serviceAccountName: vault-configure
      restartPolicy: OnFailure
      containers:
        - name: vault-configure
          image: hashicorp/vault:1.20.4
          env:
            - name: VAULT_ADDR
              value: http://vault-service.vault:8200  # Same namespace, but kept fully qualified for consistency
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef: {name: vault-dev-token, key: token}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for mount in services infra; do
                if vault secrets list | grep -q "^${mount}/"; then
                  echo "KV mount ${mount}/ already enabled"
                else
                  vault secrets enable -path="${mount}" kv-v2
                fi
              done
