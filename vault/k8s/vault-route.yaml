apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
  labels:
    app: vault
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - vault.localhost
  rules:
    - backendRefs:
        - name: vault-service
          port: 8200
