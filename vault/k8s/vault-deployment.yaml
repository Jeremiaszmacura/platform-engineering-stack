apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.20.4
          # Dev mode: in memory, auto-unsealed. No livenessProbe: a restart wipes all secrets.
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef: {name: vault-dev-token, key: token}
            # Skip the entrypoint's setcap: it copies the ~475 MiB binary and OOMs the limit (dev mode doesn't mlock).
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - containerPort: 8200
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            initialDelaySeconds: 3
            periodSeconds: 5
          # Dev mode starts empty, so every container start (new pod, crash, OOM kill) enables the KV v2 mounts again.
          # The container counts as running, and can become ready, only after this exits; a failure restarts it.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e
                    # Hook output isn't logged; send it to the container's log
                    exec >/proc/1/fd/1 2>&1
                    export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN="$VAULT_DEV_ROOT_TOKEN_ID"
                    # The server starts alongside this hook
                    waited=0
                    until vault status >/dev/null 2>&1; do
                      if [ "$waited" -ge 60 ]; then echo "postStart: Vault did not answer within 60s"; exit 1; fi
                      sleep 2
                      waited=$((waited + 2))
                    done
                    for mount in services infra; do
                      if vault secrets list | grep -q "^${mount}/"; then
                        echo "postStart: KV mount ${mount}/ already enabled"
                      else
                        vault secrets enable -path="${mount}" kv-v2
                      fi
                    done
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault
  labels:
    app: vault
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: vault
    # No token needed in dev mode; Vault answers in Prometheus format because Prometheus' Accept header asks for it.
    prometheus.io/path: /v1/sys/metrics
spec:
  type: ClusterIP
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
