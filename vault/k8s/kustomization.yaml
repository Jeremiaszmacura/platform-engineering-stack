# Applied with `kubectl apply -k`, which builds the ConfigMap from the plain files next to it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault-root-token.yaml
  - vault-route.yaml
  - vault-serviceaccount.yaml
  - vault-statefulset.yaml
configMapGenerator:
  - name: vault-config
    namespace: vault
    files:
      - vault.hcl
      - configure-vault.sh
      - stock-app-policy.hcl
    options:
      labels:
        app: vault
