apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  serviceName: vault-headless
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:1.20.4
          args: ["vault", "server", "-config=/etc/vault/vault.hcl"]
          env:
            - name: VAULT_ROOT_TOKEN
              valueFrom:
                secretKeyRef: {name: vault-root-token, key: token}
            # Skip the entrypoint's setcap: it copies the ~475 MiB binary and OOMs the limit (vault.hcl disables mlock).
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - containerPort: 8200
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/vault
            - name: data
              mountPath: /vault/data
          # Runs on every container start (new pod, crash, OOM kill). The container counts as running, and can become
          # ready, only after the hook exits; a failed hook restarts the container.
          lifecycle:
            postStart:
              exec:
                command: ["/etc/vault/configure-vault.sh"]
      volumes:
        - name: config
          configMap:
            name: vault-config
            defaultMode: 0555  # The hook runs the script directly
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault
  labels:
    app: vault
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: vault
    # No token needed (vault.hcl); Vault answers in Prometheus format because Prometheus' Accept header asks for it.
    prometheus.io/path: /v1/sys/metrics
spec:
  type: ClusterIP
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault-headless
  namespace: vault
  labels:
    app: vault
spec:
  clusterIP: None
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
