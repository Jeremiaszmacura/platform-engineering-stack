# No Kubernetes API access: token automount disabled — see platform/README.md.
# (These accounts talk to the Vault API with VAULT_TOKEN, not to Kubernetes.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-configure
  namespace: vault
  labels:
    app: vault-configure
automountServiceAccountToken: false
