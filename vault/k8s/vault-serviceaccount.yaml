# No Kubernetes API access (these use VAULT_TOKEN, not the API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-configure
  namespace: vault
  labels:
    app: vault-configure
automountServiceAccountToken: false
