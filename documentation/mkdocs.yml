site_name: Platform Engineering Stack
site_url: https://jeremiaszmacura.github.io/platform-engineering-stack/
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Design: design.md
  - Platform Decisions: platform-decisions.md
  - Adding a Service: adding-a-service.md
  - Services:
      - python-app: services/python-app.md
      - go-app: services/go-app.md
      - frontend-app: services/frontend-app.md
      - nginx: services/nginx.md
      - Vault: services/vault.md
      - Monitoring: services/monitoring.md
      - Documentation: services/documentation.md
  - End-to-End Tests: e2e-tests.md
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - codehilite
  - footnotes
  - meta
  - tables
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
