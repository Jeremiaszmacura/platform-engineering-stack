apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: documentation-route
  namespace: docs
  labels:
    app: documentation
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - docs.localhost
  rules:
    - backendRefs:
        - name: documentation-service
          port: 80
