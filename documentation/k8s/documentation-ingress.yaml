apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documentation-ingress
  labels:
    app: documentation
spec:
  ingressClassName: nginx
  rules:
    - host: docs.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: documentation-service
                port:
                  number: 80
