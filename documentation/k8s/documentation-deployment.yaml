apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation
  namespace: docs
  labels:
    app: documentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documentation
  template:
    metadata:
      labels:
        app: documentation
    spec:
      serviceAccountName: documentation
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # distroless "nonroot"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: documentation
          image: documentation:dev  # built locally and loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CLUSTER_NAME
              value: sample-cluster
            # Service addresses that live in config files, not in env vars, so the map can't see them otherwise
            - name: REFERENCES
              value: grafana=http://prometheus-service:9090,grafana=http://tempo-service:3200,grafana=http://alertmanager-service:9093,prometheus=http://alertmanager-service:9093,otel-collector=http://tempo-service:4318
            - name: PROMETHEUS_URL
              value: http://prometheus-service.monitoring:9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          # Ready once the informers have finished their first list
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: documentation-service
  namespace: docs
  labels:
    app: documentation
  annotations:
    prometheus.io/scrape: "true"  # Picked up by Prometheus kubernetes_sd
    prometheus.io/job: documentation
spec:
  type: ClusterIP
  selector:
    app: documentation
  ports:
    - port: 80
      targetPort: 8080
