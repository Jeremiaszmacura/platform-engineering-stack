apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation
  namespace: docs
  labels:
    app: documentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documentation
  template:
    metadata:
      labels:
        app: documentation
    spec:
      serviceAccountName: documentation
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx-unprivileged's default user
      containers:
        - name: documentation
          image: documentation:dev  # built locally and loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: documentation-service
  namespace: docs
  labels:
    app: documentation
spec:
  type: ClusterIP
  selector:
    app: documentation
  ports:
    - port: 80
      targetPort: 8080
