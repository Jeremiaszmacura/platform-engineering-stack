[tox]
requires =
    tox>=4
env_list = pre-commit, tests
# Plain scripts, imported from PYTHONPATH; nothing to install.
no_package = true

[testenv]
deps =
    -r ../../requirements-dev.txt
setenv =
    PYTHONPATH = {toxinidir}

[testenv:pre-commit]
description = Run the repository's pre-commit hooks
commands =
    pre-commit run --all-files --config ../../.pre-commit-config.yaml

[testenv:tests]
description = Run unit tests (no cluster needed)
commands =
    coverage run -m unittest discover -s tests -p "test_*.py"
    coverage report -m --include="model.py"
