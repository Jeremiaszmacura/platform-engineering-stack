[tox]
requires =
    tox>=4
env_list = pre-commit, tests, coverage
# pyproject.toml holds tool configuration only - the service is imported from
# PYTHONPATH, never installed - so tox must not try to build it as a package.
no_package = true

[testenv]
description = Run tests
deps =
    -r requirements-dev.txt

[testenv:api]
description = Regenerate the HTTP models from openapi.yaml
commands =
    # Every setting lives in [tool.datamodel-codegen] in pyproject.toml, so the
    # drift check below regenerates with identical arguments.
    datamodel-codegen

[testenv:record]
description = Record a live provider response into fixtures/ for offline replay
setenv =
    PYTHONPATH = {toxinidir}
commands =
    # Reaches Yahoo Finance. Run it by hand, never from CI - CI is the thing
    # that consumes the recording.
    python tools/record_market_data.py

[testenv:pre-commit]
description = Run pre-commit hooks, the hexagonal import contracts and the API contract
allowlist_externals = diff
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pre-commit run --all-files --config ../.pre-commit-config.yaml
    # The dependency rule is architecture, not style, so it is enforced here
    # rather than left to review. Contracts live in .importlinter.
    lint-imports
    # openapi.yaml is the source of the HTTP models, so a contract edit that was
    # never regenerated fails the build instead of quietly shipping a service
    # whose responses no longer match what it publishes.
    datamodel-codegen --output {envtmpdir}/models.py
    diff -u src/adapters/inbound/http/models.py {envtmpdir}/models.py

[testenv:tests]
description = Run tests
setenv =
    # The service is a package tree (src.domain, src.adapters, ...), so the
    # importable root is the service directory itself, matching `src.main:app`
    # in the Dockerfile.
    PYTHONPATH = {toxinidir}
commands =
    coverage run -m unittest discover -s tests -p "test_*.py"

[testenv:coverage]
description = Run coverage
commands =
    coverage report -m
