[tox]
requires =
    tox>=4
env_list = pre-commit, tests, coverage
# Tool config only; the service is imported from PYTHONPATH, not installed.
no_package = true

[testenv]
description = Run tests
deps =
    -r requirements-dev.txt

[testenv:api]
description = Regenerate the HTTP models from openapi.yaml
commands =
    # Settings are in [tool.datamodel-codegen] in pyproject.toml.
    datamodel-codegen

[testenv:record]
description = Record a live provider response into fixtures/ for offline replay
setenv =
    PYTHONPATH = {toxinidir}
commands =
    # Calls Yahoo Finance; run by hand, never in CI.
    python tools/record_market_data.py

[testenv:pre-commit]
description = Run pre-commit hooks, the hexagonal import contracts and the API contract
allowlist_externals = diff
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pre-commit run --all-files --config ../.pre-commit-config.yaml
    # Hexagonal import rules (.importlinter).
    lint-imports
    # Fail if models.py was not regenerated after a contract change.
    datamodel-codegen --output {envtmpdir}/models.py
    diff -u src/adapters/inbound/http/models.py {envtmpdir}/models.py

[testenv:tests]
description = Run tests
setenv =
    # Import root is the service directory (src.main:app).
    PYTHONPATH = {toxinidir}
commands =
    coverage run -m unittest discover -s tests -p "test_*.py"

[testenv:coverage]
description = Run coverage
commands =
    coverage report -m
