# Client-side copy of the database password. Secrets are namespace-scoped and
# cannot be referenced across namespaces, so the same literal also exists in
# timescaledb/k8s/timescaledb-secret.yaml (namespace data). Base64, not
# encrypted - dev playground only; Vault is the eventual single source.
apiVersion: v1
kind: Secret
metadata:
  name: stock-app-secret
  namespace: apps
  labels:
    app: stock-app
type: Opaque
stringData:
  db-password: stockapp
