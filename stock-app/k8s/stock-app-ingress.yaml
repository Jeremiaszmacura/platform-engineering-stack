apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-app-ingress
  namespace: apps
  annotations:
    # The front end at app.localhost calls this backend cross-origin
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: stock.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-app-service
                port:
                  number: 8000
