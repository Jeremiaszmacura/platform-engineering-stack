apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traffic-generator-route
  namespace: apps
  labels:
    app: traffic-generator
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - traffic-generator.localhost
  rules:
    - backendRefs:
        - name: traffic-generator-service
          port: 80
