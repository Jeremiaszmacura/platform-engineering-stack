apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traffic-generator-ingress
  namespace: apps
  labels:
    app: traffic-generator
spec:
  ingressClassName: nginx
  rules:
    - host: traffic-generator.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traffic-generator-service
                port:
                  number: 80
